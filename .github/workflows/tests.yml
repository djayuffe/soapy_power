name: Software validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mathematics:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 still provides the declared GUI minimum.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.12']
        include:
          # Intel macOS image (supported until Aug 2027): macOS coverage when arm64 capacity is short.
          - os: macos-15-intel
            python: '3.12'
    runs-on: ${{ matrix.os }}
    # Hosted macOS arm64 jobs have repeatedly not been acquired ("capacity constraints") and were cancelled
    # after 15 min in the queue. Their result is still shown, but it does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy simplespectral build twine pytest
      # pyFFTW 0.15.1's macOS x86_64 wheel segfaults on import (seen 2026-11-24 on macos-15-intel with
      # numpy 2.5.5 / scipy 1.18.1), and simplespectral imports it automatically. Not installed there.
      - if: matrix.os != 'macos-15-intel'
        run: python -m pip install pyfftw
      # Optional analysis/report tooling (superscan, satellite identification, PDF reports).
      - run: python -m pip install matplotlib sgp4 reportlab pypdf
      - run: python -m pip install --no-deps -e .
      - name: Import smoke test (native extensions)
        run: python -X faulthandler -c "import platform, numpy, scipy, simplespectral; print(platform.platform(), platform.machine(), numpy.__version__, scipy.__version__, 'pyfftw' if simplespectral.fft_pyfftw else 'no pyfftw')"
      - run: python tools/validate.py --backend numpy
      - run: python tools/validate.py --backend scipy
      - if: matrix.os != 'macos-15-intel'
        run: python tools/validate.py --backend fftw
      - run: python tools/fuzz_integration.py --trials 10000
      - run: python -m build
      - run: python -m twine check dist/*
      - run: soapy_power --help
      - run: soapy_power_gui --help
      - run: soapy_power_calibration --help
      - run: soapy_power_noise_audit --help
      - run: soapy_power_experiment --help
      - run: soapy_power_analysis --help
      - run: soapy_power_telemetry --help
      - run: soapy_power_spurs --help
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.9
      # Errors that change behaviour: syntax, undefined names, unused imports/variables, placeholder-less f-strings.
      - run: ruff check --select E9,F soapypower tools tests
      # Modules kept in ruff format (pyproject.toml settings); extend this list as files are reformatted.
      - run: ruff format --check soapypower/gui.py tools/superscan_run.py tools/analyze_scan_set.py tools/report_bundle.py tools/waterfall_geometry.py
      - run: shellcheck -S warning tools/macos_runner/*.sh examples/ettus/scan.sh
      - run: node --check soapypower/web/app.js
